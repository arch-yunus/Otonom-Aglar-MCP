name: MCP CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Playwright kurulumu (v14 için gerekli)
        playwright install chromium
        
    - name: Cache Sentence Transformers
      uses: actions/cache@v4
      with:
        path: ~/.cache/torch
        key: ${{ runner.os }}-torch-${{ hashFiles('requirements.txt') }}

    - name: Run Pytest
      run: |
        pytest tests/ -v
        
  docker-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker Image
      run: docker build -t otonom-aglar-mcp:test .
      
    - name: Test Docker Compose Parsing
      run: |
        docker-compose config 
        # Yeni servislerin (Modül 7-8) varlığını doğrula
        docker-compose config | grep -E "gui-dashboard|project-architect"
