<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otonom-Ağlar MCP | Visual Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(148, 163, 184, 0.1); }
        .thought-card { border-left: 4px solid #8b5cf6; padding-left: 1rem; margin-bottom: 1rem; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto p-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 glass p-6 rounded-2xl shadow-2xl">
            <div>
                <h1 class="text-3xl font-semibold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-indigo-400">
                    Otonom-Ağlar MCP Dashboard
                </h1>
                <p class="text-slate-400 text-sm mt-1">Gerçek Zamanlı Ajan Telemetrisi v2.0</p>
            </div>
            <div id="status" class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-emerald-400 font-medium tracking-wide">AKTİF</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Topoloji & Sunucular -->
            <div class="lg:col-span-1 space-y-6">
                <div class="glass p-6 rounded-2xl">
                    <h2 class="text-lg font-semibold mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Aktif Protokol Ağı
                    </h2>
                    <ul class="space-y-3" id="server-list">
                        <li class="flex items-center justify-between p-3 rounded-lg bg-slate-800/50">
                            <span>SQLite Database</span>
                            <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded">BAĞLI</span>
                        </li>
                        <li class="flex items-center justify-between p-3 rounded-lg bg-slate-800/50 text-slate-500">
                            <span>Playwright Browser</span>
                            <span class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded">BEKLEMEDE</span>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Right: Thought Feed -->
            <div class="lg:col-span-2">
                <div class="glass p-6 rounded-2xl min-h-[600px] flex flex-col">
                    <h2 class="text-lg font-semibold mb-6 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                        Ajan Düşünce Akışı (Live Thoughts)
                    </h2>
                    <div id="logs" class="flex-grow space-y-4 overflow-y-auto" style="max-height: 500px;">
                        <!-- Logs here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const logsContainer = document.getElementById('logs');

        socket.on('new_log', function(log) {
            const entry = document.createElement('div');
            entry.className = 'thought-card glass border-l-4 border-violet-500 p-4 transition-all hover:bg-slate-800/80';
            entry.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-semibold text-violet-400 tracking-wider">${log.type.toUpperCase()}</span>
                    <span class="text-[10px] text-slate-500">${log.time}</span>
                </div>
                <p class="text-slate-200">${log.message}</p>
            `;
            logsContainer.prepend(entry);
        });
    </script>
</body>
</html>
